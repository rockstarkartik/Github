name: Update 3D Contribution Graph

on:
  schedule:
    - cron: "0 18 * * *"   # Daily at 18:00 UTC
  workflow_dispatch:         # Manual run button

permissions:
  contents: read             # Default: read-only

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Only this job can push, and only what it needs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1   # Third-party action, see security notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update 3D contribution graph"
          git push

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Neetesh Singh Rajpoot, Full Stack Developer">
  <title>Neetesh Singh Rajpoot - Web Developer</title>
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11131f"/>
      <stop offset="1" stop-color="#0d0e16"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card-clip">
      <rect x="8" y="8" width="984" height="284" rx="20"/>
    </clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; }
    .mono { font-family: Consolas, 'Courier New', monospace; }
    .rise { opacity: 0; animation: rise .9s ease-out both; }
    .d1 { animation-delay: .1s; }
    .d2 { animation-delay: .3s; }
    .d3 { animation-delay: .5s; }
    .d4 { animation-delay: .7s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .role { opacity: 0; animation: roles 9s infinite; }
    .role.r2 { animation-delay: 3s; }
    .role.r3 { animation-delay: 6s; }
    @keyframes roles {
      0% { opacity: 0; transform: translateY(6px); }
      4% { opacity: 1; transform: none; }
      30% { opacity: 1; }
      36%, 100% { opacity: 0; }
    }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 1.8s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3); opacity: 0; } }
    .scan { animation: sweep 4s linear infinite; }
    @keyframes sweep { from { transform: translateY(-80px); } to { transform: translateY(300px); } }
    .line { opacity: 0; animation: rise .6s ease-out both; }
    .l1 { animation-delay: .8s; }
    .l2 { animation-delay: 1.1s; }
    .l3 { animation-delay: 1.4s; }
    .l4 { animation-delay: 1.7s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- Background -->
  <rect x="8" y="8" width="984" height="284" rx="20" fill="url(#glass)"/>
  <rect x="8" y="8" width="984" height="284" rx="20" fill="url(#dots)"/>
  <g clip-path="url(#card-clip)">
    <circle cx="860" cy="40" r="150" fill="#a78bfa" opacity="0.18" filter="url(#soft)"/>
    <circle cx="90" cy="290" r="130" fill="#22d3ee" opacity="0.12" filter="url(#soft)"/>
    <rect class="scan" x="8" y="0" width="984" height="90" fill="url(#scan)"/>
  </g>
  <rect x="8.75" y="8.75" width="982.5" height="282.5" rx="20" fill="none" stroke="url(#hl)" stroke-width="1.5"/>

  <!-- Status pill -->
  <rect x="50" y="36" width="200" height="30" rx="15" fill="#11131f" stroke="#22d3ee" stroke-opacity="0.5"/>
  <circle cx="68" cy="51" r="5" fill="#22d3ee" class="ping"/>
  <circle cx="68" cy="51" r="5" fill="#22d3ee"/>
  <text x="82" y="56" class="sans" font-size="13" fill="#cbd5e1">J.A.R.V.I.S </text>

  <!-- Intro -->
  <text x="50" y="108" class="sans rise d1" font-size="22" fill="#94a3b8">Hi there, I'm</text>
  <text x="48" y="168" class="sans rise d2" font-size="48" font-weight="700" fill="url(#name)">Neetesh Singh Rajpoot</text>

  <!-- Cycling roles -->
  <text x="50" y="206" class="mono role" font-size="21" fill="#22d3ee">&gt;Web Developer_</text>
  <text x="50" y="206" class="mono role r2" font-size="21" fill="#f472b6">&gt; CyberSecurity Agent_</text>
  <text x="50" y="206" class="mono role r3" font-size="21" fill="#a78bfa">&gt; Clean UI Craftsman_</text>

  <text x="50" y="238" class="sans rise d3" font-size="15" fill="#94a3b8">Building clean, fast and responsive web experiences, from pixels to APIs.</text>

  <g class="sans" font-size="13" fill="#94a3b8">
    <text x="50" y="268" class="rise d4"> Noida </text>
    <text x="200" y="268" class="rise d4"> T.O.C.S.I</text>
    <text x="440" y="268" class="rise d4"> Open to work</text>
  </g>

  <!-- Terminal card -->
  <rect x="650" y="60" width="300" height="190" rx="12" fill="#07080d" stroke="#2a2f45"/>
  <circle cx="670" cy="78" r="5" fill="#f472b6"/>
  <circle cx="686" cy="78" r="5" fill="#fbbf24"/>
  <circle cx="702" cy="78" r="5" fill="#22d3ee"/>
  <text x="670" y="118" class="mono line l1" font-size="14" fill="#a78bfa">const dev = {</text>
  <text x="686" y="142" class="mono line l2" font-size="14" fill="#e6edf3">name: <tspan fill="#22d3ee">"Neetesh"</tspan>,</text>
  <text x="686" y="166" class="mono line l3" font-size="14" fill="#e6edf3">stack: [<tspan fill="#f472b6">"Python", "JS", "Html", "Css", "MongoDb</tspan>],</text>
  <text x="686" y="190" class="mono line l4" font-size="14" fill="#e6edf3">shipping: <tspan fill="#34d399">true</tspan>,</text>
  <text x="670" y="214" class="mono line l4" font-size="14" fill="#a78bfa">};</text>
  <rect x="670" y="226" width="8" height="14" fill="#22d3ee" class="cursor"/>
</svg>
